# Pterodactyl 2.0 extension dev stack. The Panel is built into the image (Dockerfile); only
# ./extensions is mounted from here. Start it with `./ptx up` (macOS/Linux/WSL) or `ptx up`
# (Windows), then run commands the same way, or directly: docker compose exec panel ptx <command>

x-app: &app
  build:
    context: .
    args:
      PANEL_REF: ${PANEL_REF:-v2.0.0-beta.2}
  image: ptero-ext-dev:${PANEL_REF:-v2.0.0-beta.2}
  # Runs as you, so files written into ./extensions are yours. ./ptx up fills these in on Linux.
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  volumes:
    - ./extensions:/app/extensions
    - panel-var:/app/var # panel .env (APP_KEY) and which extensions bootstrap has enabled
    - panel-storage:/app/storage
    - panel-assets:/app/public/assets/extensions # published extension bundles
    - dev-home:/home/dev # npm + composer caches
  environment:
    APP_ENV: local
    APP_DEBUG: "true" # also required for p:extension:dev --watch live reload
    APP_URL: ${APP_URL:-http://localhost:${PANEL_PORT:-8000}}
    APP_TIMEZONE: UTC
    DB_CONNECTION: mysql
    DB_HOST: database
    DB_PORT: "3306"
    DB_DATABASE: panel
    DB_USERNAME: pterodactyl
    DB_PASSWORD: pterodactyl
    REDIS_HOST: cache
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    SESSION_CONNECTION: sessions
    QUEUE_CONNECTION: redis
    MAIL_MAILER: log
    PHP_CLI_SERVER_WORKERS: "4"
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}

x-after-setup: &after-setup
  depends_on:
    setup:
      condition: service_completed_successfully

services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: pterodactyl
      MARIADB_PASSWORD: pterodactyl
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot on every start: keys, migrations, first-run admin + Dev Server, enable new extensions.
  setup:
    <<: *app
    command: ["ptx", "bootstrap"]
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  panel:
    <<: [*app, *after-setup]
    # --no-reload keeps the compose environment; without it artisan serve re-reads .env only.
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "${PANEL_PORT:-8000}:8000"
    restart: unless-stopped

  queue:
    <<: [*app, *after-setup]
    # queue:listen reloads code for every job, so extension changes apply without a restart.
    command: ["php", "artisan", "queue:listen", "--queue=high,standard,low", "--tries=1", "--timeout=60"]
    restart: unless-stopped

  scheduler:
    <<: [*app, *after-setup]
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

volumes:
  db:
  panel-var:
  panel-storage:
  panel-assets:
  dev-home:
